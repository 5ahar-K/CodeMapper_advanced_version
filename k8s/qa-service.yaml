apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qa-service
  template:
    metadata:
      labels:
        app: qa-service
    spec:
      containers:
        - name: qa-service
          image: codemapper_v2-qa-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50052
          env:
            - name: GRAPH_SERVICE_ADDR
              value: "graph-service:50051"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: api-key
---
apiVersion: v1
kind: Service
metadata:
  name: qa-service
spec:
  selector:
    app: qa-service
  ports:
    - port: 50052
      targetPort: 50052
